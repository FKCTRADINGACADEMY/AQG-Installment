<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AQG — Installment & Tuition Mentor</title>
<!-- PWA: makes the app installable ("Add to Home Screen") and lets it open full-screen without the browser address bar. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#142B53">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AQG Mentor">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAA  ... large base64 icon ... ">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E7; --paper-dark:#EFE7D4; --ink:#1C2B24;
    --teal:#142B53; --gold:#C79A3E; --brick:#AE4128; --line:#DDD3B8;
    --login-bg: linear-gradient(160deg, #142B53, #0A152E);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;}
  .wrap{max-width:480px; margin:0 auto; padding-bottom:80px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  header{position:sticky; top:0; z-index:20; background:rgba(247,242,231,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); box-shadow:0 2px 10px rgba(28,43,36,.04);}
  header .inner{max-width:480px; margin:0 auto; padding:16px; display:flex; align-items:center; gap:12px;}
  header img{width:44px; height:44px; border-radius:10px; object-fit:cover;}
  header .brand{flex:1;}
  header .brand .name{font-family:'Fraunces',serif; font-weight:700; font-size:20px; line-height:1.1;}
  header .brand .tagline{font-size:11px; color:var(--teal); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  header .brand .owner{font-size:11px; opacity:.6; margin-top:2px;}
  .content{padding:16px;}
  .toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50; background:var(--teal); color:var(--paper); padding:8px 16px; border-radius:999px; font-size:13px; box-shadow:0 6px 16px rgba(0,0,0,.15); display:none;}
  .toast.error{background:var(--brick);}
  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(28,43,36,.04);}
  .vc-card{border-radius:16px; padding:24px 20px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.18); position:relative; overflow:hidden;}
  .vc-logo{width:52px; height:52px; border-radius:12px; object-fit:cover; margin-bottom:8px; box-shadow:0 4px 10px rgba(0,0,0,.3); background:#fff; padding:4px; position:relative; z-index:1;}
  .vc-card .vc-name{font-family:'Fraunces',serif; font-weight:700; font-size:20px; position:relative; z-index:1;}
  .vc-card .vc-tagline{font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.8; margin:2px 0 14px; position:relative; z-index:1;}
  .vc-card .vc-line{font-size:12px; opacity:.92; line-height:1.7; position:relative; z-index:1;}
  .vc-card::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% -10%, rgba(255,255,255,.16), transparent 55%); pointer-events:none;}
  .vc-card::after{content:''; position:absolute; left:16px; right:16px; bottom:14px; height:1px; background:rgba(255,255,255,.25);}
  .vc-theme-teal{background:linear-gradient(135deg, #142B53, #0A152E); color:#fff;}
  .vc-theme-gold{background:linear-gradient(135deg, #d4af37, #7a5a0a); color:#fff;}
  .vc-theme-navy{background:linear-gradient(135deg, #1b3a6b, #0a1730); color:#fff;}
  .vc-theme-maroon{background:linear-gradient(135deg, #8a1538, #3a0714); color:#fff;}
  .vc-theme-sunset{background:linear-gradient(135deg, #e0672a, #7a2b0a); color:#fff;}
  .vc-theme-mint{background:linear-gradient(135deg, #ffffff, #e6efe9); color:#142B53; box-shadow:0 8px 20px rgba(0,0,0,.12), inset 0 0 0 1px var(--line);}
  .vc-theme-mint::after{background:rgba(20,43,83,.18);}

  .greet-card{border-radius:18px; padding:30px 18px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.18); position:relative; overflow:hidden;}
  .greet-card .greet-logo-wrap{width:60px; height:60px; margin:0 auto 10px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.3); position:relative; z-index:1;}
  .greet-card .greet-logo-wrap img{width:44px; height:44px; object-fit:cover; border-radius:10px;}
  .greet-card .greet-title{font-family:'Fraunces',serif; font-weight:700; font-size:26px; position:relative; z-index:1; text-shadow:0 2px 6px rgba(0,0,0,.2);}
  .greet-card .greet-sub{font-size:12px; opacity:.92; margin:8px 0 18px; position:relative; z-index:1; line-height:1.5;}
  .greet-card .greet-divider{width:40px; height:2px; background:rgba(255,255,255,.55); margin:0 auto 12px; position:relative; z-index:1;}
  .greet-card .greet-shop{font-size:11px; text-transform:uppercase; letter-spacing:.06em; opacity:.8; position:relative; z-index:1;}
  .greet-card::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 15% 110%, rgba(255,255,255,.18), transparent 55%); pointer-events:none;}
  .greet-theme-eid{background:linear-gradient(150deg, #142B53, #0A152E); color:#fff;}
  .greet-theme-ramzan{background:linear-gradient(150deg, #2f1b52, #120826); color:#fff;}
  .greet-theme-newyear{background:linear-gradient(150deg, #1b3a6b, #06132b); color:#fff;}
  .greet-theme-azadi{background:linear-gradient(150deg, #0a6e3a, #063d20); color:#fff;}
  .greet-theme-thankyou{background:linear-gradient(150deg, #b8860b, #7a5a0a); color:#fff;}
  .card.dashed{border-style:dashed;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; opacity:.6;}
  .stat-value{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; margin-top:6px;}

  /* ---- Modern dashboard ---- */
  .dash-hero{position:relative; overflow:hidden; border-radius:22px; padding:20px 18px; margin-bottom:16px; background:linear-gradient(135deg, #142B53 0%, #1e3d6e 55%, #0A152E 100%); color:#fff; box-shadow:0 10px 26px rgba(20,43,83,.28);}
  .dash-hero::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 90% -10%, rgba(255,255,255,.18), transparent 55%); pointer-events:none;}
  .dash-hero::after{content:''; position:absolute; right:-30px; bottom:-40px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, rgba(199,154,62,.35), transparent 70%); pointer-events:none;}
  .dash-hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative; z-index:1;}
  .dash-hero-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; font-weight:600;}
  .dash-hero-amount{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:30px; margin-top:4px; line-height:1.1;}
  .dash-eye-btn{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:12px; width:38px; height:38px; font-size:16px; cursor:pointer; flex-shrink:0; backdrop-filter:blur(2px);}
  .dash-sync-pill{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); padding:5px 10px; border-radius:999px; margin-top:14px; position:relative; z-index:1;}
  .dash-sync-dot{width:6px; height:6px; border-radius:50%; background:#7CE0BE; box-shadow:0 0 0 3px rgba(124,224,190,.25);}
  .dash-sync-pill.offline .dash-sync-dot{background:#E0B96A; box-shadow:0 0 0 3px rgba(224,185,106,.25);}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .stat-card{position:relative; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 14px 13px; overflow:hidden; box-shadow:0 3px 10px rgba(28,43,36,.05); transition:transform .12s ease;}
  .stat-card:active{transform:scale(.98);}
  .stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--sc-accent, var(--teal));}
  .stat-card .stat-icon{font-size:16px; opacity:.85; margin-bottom:8px; display:block;}
  .stat-card .stat-label{margin-bottom:0;}
  .stat-card .stat-value{font-size:18px; margin-top:5px;}
  .stat-card.wide{grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;}
  .stat-card.wide .stat-icon{margin-bottom:0;}
  .recent-item{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px 12px; margin-bottom:8px; cursor:pointer; box-shadow:0 2px 6px rgba(28,43,36,.04);}
  .recent-avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, var(--teal), #0A152E); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .quick-tool-card{display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, #fff, var(--paper-dark)); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:14px; cursor:pointer; box-shadow:0 3px 10px rgba(28,43,36,.05); transition:transform .1s ease;}
  .quick-tool-card:active{transform:scale(.98);}
  .quick-tool-card .qt-icon{width:38px; height:38px; border-radius:11px; background:#C79A3E22; color:#8a6d1f; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .quick-tool-card .qt-title{font-weight:700; font-size:13.5px;}
  .quick-tool-card .qt-sub{font-size:11px; opacity:.6; margin-top:2px;}
  .quick-tool-card .qt-arrow{font-size:20px; opacity:.35;}
  .section-title-row{display:flex; align-items:center; justify-content:space-between; margin:18px 0 8px;}
  .section-title-row .section-title{margin:0;}

  /* ---- Dashboard monthly charts ---- */
  .chart-scroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; scroll-snap-type:x mandatory;}
  .chart-scroll::-webkit-scrollbar{display:none;}
  .chart-card{flex:0 0 78%; scroll-snap-align:start; background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px 14px 12px; box-shadow:0 3px 10px rgba(28,43,36,.05);}
  .chart-card-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .chart-card-head .cch-title{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; opacity:.6; display:flex; align-items:center; gap:5px;}
  .chart-card-head .cch-total{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .chart-bars{display:flex; align-items:flex-end; gap:7px; height:74px;}
  .chart-bars .bar{flex:1; border-radius:5px 5px 2px 2px; min-height:3px;}
  .chart-labels{display:flex; gap:7px; margin-top:6px; font-size:9px; opacity:.55; text-align:center;}
  .chart-labels span{flex:1;}
  .section-title{font-size:13px; font-weight:600; opacity:.8; margin:18px 0 8px;}
  .empty{border:1px dashed var(--line); border-radius:12px; padding:22px; text-align:center; font-size:13px; opacity:.6;}
  input,select{width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; background:#fff; font-family:inherit; outline:none;}
  label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; opacity:.6; margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:11px 14px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; transition:transform .08s ease, box-shadow .08s ease;}
  .btn:active{transform:scale(.97);}
  .btn-teal{background:var(--teal); color:var(--paper); box-shadow:0 4px 10px rgba(20,43,83,.25);}
  .btn-gold{background:var(--gold); color:var(--ink); box-shadow:0 4px 10px rgba(199,154,62,.3);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-outline-teal{background:transparent; border:1px solid var(--teal); color:var(--teal);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 10px; font-size:12px; border-radius:8px;}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .party-item{background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px; margin-bottom:8px; cursor:pointer; box-shadow:0 2px 6px rgba(28,43,36,.04); transition:transform .1s ease;}
  .party-item:active{transform:scale(.985);}
  .party-item .pname{font-weight:600; font-size:14px;}
  .party-item .pmeta{font-size:12px; opacity:.6; margin-top:2px;}
  .stamp{font-size:10px; font-weight:700; padding:2px 8px; border-radius:6px; border:2px solid; text-transform:uppercase; letter-spacing:.04em; transform:rotate(-6deg); display:inline-block; white-space:nowrap;}
  .searchbar{display:flex; gap:8px; margin-bottom:12px;}
  .searchbar input{flex:1;}
  .ledger-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .ledger-row:last-child{border-bottom:none;}
  .icon-btn{background:none; border:none; cursor:pointer; opacity:.45; padding:4px;}
  .icon-btn:hover{opacity:.9;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.04em; opacity:.55; padding:6px 4px; border-bottom:1px solid var(--line);}
  td{padding:7px 4px; border-bottom:1px dashed var(--line);}
  .badge{font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px;}
  .badge.paid{background:#0E5C4C22; color:var(--teal);}
  .badge.due{background:#AE412822; color:var(--brick);}
  .badge.future{background:#C79A3E22; color:#8a6d1f;}
  nav.bottom{position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line); z-index:20;}
  nav.bottom .inner{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); text-align:center; font-size:10px;}
  nav.bottom button{background:none; border:none; padding:10px 0; color:#8a8271; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav.bottom button.active{color:var(--teal); font-weight:700;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(28,43,36,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--paper); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
  .modal .row-between{margin-bottom:14px;}
  .close-x{background:none; border:none; font-size:18px; cursor:pointer; opacity:.6;}
  .method-row{display:flex; gap:8px; margin:10px 0;}
  .method-btn{flex:1; padding:9px 0; border-radius:8px; font-size:12px; font-weight:600; border:1px solid var(--line); background:transparent; cursor:pointer;}
  .method-btn.active{background:var(--teal); color:var(--paper); border-color:var(--teal);}

  /* ---- Party list filter chips ---- */
  .filter-chip-row{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto;}
  .filter-chip{flex:0 0 auto; padding:7px 14px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); background:#fff; cursor:pointer; white-space:nowrap;}
  .filter-chip.active{background:var(--teal); color:var(--paper); border-color:var(--teal);}
  .filter-chip[data-f="payable"].active{background:var(--gold); border-color:var(--gold); color:#3a2a05;}
  .filter-chip[data-f="overdue"].active{background:var(--brick); border-color:var(--brick); color:#fff;}

  /* ---- Hamburger + sidebar drawer ---- */
  .hamburger-btn{background:none; border:1px solid var(--line); border-radius:10px; width:38px; height:38px; font-size:16px; cursor:pointer; flex-shrink:0;}
  .sidebar-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; display:none;}
  .sidebar-overlay.open{display:block;}
  .sidebar-drawer{position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--paper); z-index:41; box-shadow:4px 0 20px rgba(0,0,0,.25); transform:translateX(-100%); transition:transform .2s ease; overflow-y:auto;}
  .sidebar-drawer.open{transform:translateX(0);}
  .sidebar-head{padding:18px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .sidebar-head .name{font-family:'Fraunces',serif; font-weight:700; font-size:18px;}
  .sidebar-close{background:none; border:none; font-size:18px; cursor:pointer; padding:4px 8px;}
  .sidebar-section-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; opacity:.55; font-weight:700; padding:14px 16px 6px;}
  .sidebar-link{display:flex; align-items:center; gap:10px; padding:11px 16px; font-size:13px; font-weight:600; cursor:pointer; border-bottom:1px solid var(--line);}
  .sidebar-link:active{background:var(--paper-dark);}
  .sidebar-link .sl-icon{font-size:16px; width:20px; text-align:center;}
  .sidebar-link .sl-badge{margin-left:auto; font-size:11px; font-weight:700; opacity:.7;}
  .view{display:none;}
  .view.active{display:block;}
  .footer-note{font-size:11px; opacity:.5; text-align:center; margin-top:18px; line-height:1.6;}
  #thermalReceipt{display:none;}
  #cardReceipt, #invoiceReceipt{display:none; width:380px; background:#fff; color:#26332c; font-family:'Inter',sans-serif; padding:20px;}
  #cardReceipt .cr-head, #invoiceReceipt .cr-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  #cardReceipt .cr-head img, #invoiceReceipt .cr-head img{width:40px; height:40px; border-radius:8px; object-fit:cover;}
  #cardReceipt .cr-shop, #invoiceReceipt .cr-shop{font-weight:700; font-size:14px; color:#26332c;}
  #cardReceipt .cr-sub, #invoiceReceipt .cr-sub{font-size:11px; opacity:.6;}
  #cardReceipt .cr-title, #invoiceReceipt .cr-title{text-align:center; font-family:'Fraunces',serif; font-weight:700; font-size:19px; margin:10px 0 16px;}
  #cardReceipt .cr-row, #invoiceReceipt .cr-row{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;}
  #cardReceipt .cr-row .lbl, #invoiceReceipt .cr-row .lbl{opacity:.55;}
  #cardReceipt .cr-box, #invoiceReceipt .cr-box{border:1px solid #e4ddcf; border-radius:12px; padding:14px; margin:14px 0;}
  #cardReceipt .cr-box .cr-line, #invoiceReceipt .cr-box .cr-line{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;}
  #cardReceipt .cr-box .cr-line.total, #invoiceReceipt .cr-box .cr-line.total{color:#1e6f5c; font-weight:700;}
  #invoiceReceipt .cr-box .cr-line.sub{border-top:1px dashed #e4ddcf; margin-top:4px; padding-top:8px;}
  #cardReceipt .cr-desc, #invoiceReceipt .cr-desc{font-size:11.5px; margin-top:10px;}
  #cardReceipt .cr-sign-wrap, #invoiceReceipt .cr-sign-wrap{margin-top:16px; float:right; display:flex; align-items:flex-end; gap:8px;}
  #cardReceipt .cr-sign-stamp, #invoiceReceipt .cr-sign-stamp{width:64px; height:64px; border-radius:50%; object-fit:cover; opacity:.9; transform:rotate(-8deg); flex-shrink:0; box-shadow:0 0 0 1px rgba(30,111,92,.15);}
  #cardReceipt .cr-sign, #invoiceReceipt .cr-sign{text-align:center; border:1px solid #e4ddcf; border-radius:10px; padding:8px 16px 6px;}
  #cardReceipt .cr-sign .cr-scribble, #invoiceReceipt .cr-sign .cr-scribble{display:block; margin:0 auto 2px; width:80px !important; height:auto;}
  #cardReceipt .cr-sign .cr-shopname, #invoiceReceipt .cr-sign .cr-shopname{font-size:10px; opacity:.6; border-top:1px solid #c
